// Stats
const lats = points.map(p => p.lat);
const lons = points.map(p => p.lon);
const temps = points.map(p => p.temp);
const hums = points.map(p => p.hum);

function haversine(a, b) {
  const R = 6371000, toR = Math.PI/180;
  const dLat = (b.lat - a.lat) * toR;
  const dLon = (b.lon - a.lon) * toR;
  const la1 = a.lat * toR, la2 = b.lat * toR;
  const x = Math.sin(dLat/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
let totalDist = 0;
for (let i=1; i<points.length; i++) totalDist += haversine(points[i-1], points[i]);

const avg = arr => arr.reduce((a,b)=>a+b,0)/arr.length;

document.getElementById('dur').textContent = points[0].t + ' → ' + points[points.length-1].t;
document.getElementById('dist').textContent = (totalDist/1000).toFixed(2) + ' km';
document.getElementById('at').textContent = avg(temps).toFixed(1) + '°';
document.getElementById('ah').textContent = avg(hums).toFixed(1) + '%';

// Map
const map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap contributors', maxZoom: 19
}).addTo(map);

const bounds = L.latLngBounds(points.map(p => [p.lat, p.lon]));
map.fitBounds(bounds, { padding: [40, 40] });
setTimeout(() => map.invalidateSize(), 100);
window.addEventListener('resize', () => map.invalidateSize());

// Color scale: cool blue -> warm red (viridis-ish but simpler)
function colorFor(v, vmin, vmax) {
  const t = Math.max(0, Math.min(1, (v - vmin) / (vmax - vmin)));
  // blue (220) -> red (0), through cyan/green/yellow
  const hue = 220 - t * 220;
  return `hsl(${hue}, 80%, 50%)`;
}

let segments = [];
function render(metric) {
  segments.forEach(s => map.removeLayer(s));
  segments = [];
  const vals = metric === 'temp' ? temps : hums;
  const vmin = Math.min(...vals), vmax = Math.max(...vals);

  // Build short segments so color can vary along the route
  for (let i=1; i<points.length; i++) {
    const v = (vals[i-1] + vals[i]) / 2;
    const seg = L.polyline(
      [[points[i-1].lat, points[i-1].lon], [points[i].lat, points[i].lon]],
      { color: colorFor(v, vmin, vmax), weight: 5, opacity: 0.9 }
    ).addTo(map);
    const p = points[i];
    seg.bindPopup(
      `<div class="time">${p.t}</div>` +
      `Temp: ${p.temp.toFixed(2)}°<br>` +
      `Humidity: ${p.hum.toFixed(2)}%<br>` +
      `<span style="color:#888">${p.lat.toFixed(5)}, ${p.lon.toFixed(5)}</span>`
    );
    segments.push(seg);
  }

  // Legend
  const unit = metric === 'temp' ? '°' : '%';
  document.getElementById('legend-title').textContent =
    metric === 'temp' ? 'Temperature' : 'Humidity';
  document.getElementById('legend-min').textContent = vmin.toFixed(1) + unit;
  document.getElementById('legend-max').textContent = vmax.toFixed(1) + unit;
  // gradient bar
  const stops = [];
  for (let i=0; i<=10; i++) {
    const v = vmin + (vmax - vmin) * (i/10);
    stops.push(colorFor(v, vmin, vmax) + ' ' + (i*10) + '%');
  }
  document.getElementById('legend-bar').style.background =
    'linear-gradient(to right, ' + stops.join(', ') + ')';
}

// Start/end markers
const start = points[0], end = points[points.length-1];
L.circleMarker([start.lat, start.lon], {
  radius: 8, color: '#fff', weight: 2, fillColor: '#16a34a', fillOpacity: 1
}).addTo(map).bindPopup(`<b>Start</b><br>${start.t}`);
L.circleMarker([end.lat, end.lon], {
  radius: 8, color: '#fff', weight: 2, fillColor: '#dc2626', fillOpacity: 1
}).addTo(map).bindPopup(`<b>End</b><br>${end.t}`);

// Toggle handlers
const bT = document.getElementById('b-temp');
const bH = document.getElementById('b-hum');
bT.onclick = () => { bT.classList.add('active'); bH.classList.remove('active'); render('temp'); };
bH.onclick = () => { bH.classList.add('active'); bT.classList.remove('active'); render('hum'); };

render('temp');
