<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bike rides</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; background: #eee; }
  .leaflet-tile-pane { filter: grayscale(100%) contrast(1.05); }

  .panel {
    position: absolute; top: 12px; left: 12px; z-index: 1000;
    background: rgba(255,255,255,0.97); padding: 12px 14px; border-radius: 8px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15); font-size: 13px;
    width: 280px; max-height: calc(100% - 24px); overflow-y: auto;
  }
  .panel h2 { margin: 0; font-size: 14px; }
  .panel .header { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
  .panel .section { padding: 8px 0; border-top: 1px solid #eee; }
  .panel .section:first-of-type { border-top: none; padding-top: 0; }
  .panel .stat { display: flex; justify-content: space-between; gap: 12px; padding: 2px 0; color: #333; }
  .panel .stat b { font-weight: 600; }
  .panel .lbl { display: block; font-size: 11px; color: #666; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
  input[type="text"] {
    width: 100%; padding: 6px 8px; border: 1px solid #ccc;
    border-radius: 4px; font-size: 12px; box-sizing: border-box; font-family: inherit;
  }
  label.upload {
    display: block; padding: 8px 10px; border: 1px dashed #aaa; border-radius: 6px;
    text-align: center; cursor: pointer; color: #555; font-size: 12px;
    transition: background 0.15s, border-color 0.15s; margin-top: 8px;
  }
  label.upload:hover { background: #f5f7ff; border-color: #2563eb; color: #2563eb; }
  label.upload.disabled { opacity: 0.5; pointer-events: none; }
  label.upload input { display: none; }
  select, button.btn {
    width: 100%; padding: 6px 8px; border: 1px solid #ccc; background: white;
    border-radius: 4px; font-size: 12px; box-sizing: border-box; font-family: inherit;
  }
  select { margin-top: 6px; cursor: pointer; }
  button.btn { margin-top: 6px; cursor: pointer; }
  button.btn:hover { background: #f5f5f5; }
  button.btn:disabled { opacity: 0.5; cursor: not-allowed; }
  button.btn.danger { color: #b91c1c; border-color: #fca5a5; }
  button.btn.danger:hover { background: #fef2f2; border-color: #b91c1c; }
  .toggle { display: flex; gap: 4px; }
  .toggle button {
    flex: 1; padding: 6px 4px; border: 1px solid #ccc; background: #fff;
    border-radius: 4px; cursor: pointer; font-size: 12px;
  }
  .toggle button.active { background: #2563eb; color: white; border-color: #2563eb; }
  button.btn.plot {
    background: #111; color: white; border-color: #111; margin-top: 6px;
  }
  button.btn.plot:hover { background: #333; }
  button.btn.plot:disabled { background: #999; border-color: #999; }
  .preview {
    position: fixed; top: 12px; right: 12px; z-index: 1100;
    background: white; padding: 8px; border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    width: clamp(280px, 40vw, 520px);
  }
  .preview-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 6px; padding: 0 4px; font-size: 12px; font-weight: 600; color: #333;
  }
  .preview-actions { display: flex; gap: 4px; }
  .preview-btn {
    width: 26px; height: 26px; border: 1px solid #ccc; background: white;
    border-radius: 4px; cursor: pointer; font-size: 14px; line-height: 1;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .preview-btn:hover { background: #f5f5f5; }
  .preview-btn.download { color: #2563eb; border-color: #93c5fd; }
  .preview-btn.download:hover { background: #eff6ff; }
  .preview-body { position: relative; min-width: 320px; min-height: 120px; }
  .preview-body canvas {
    max-width: 480px; max-height: 380px; display: block; border-radius: 4px;
    width: 100%; height: auto;
  }
  .preview-loading {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; background: rgba(255,255,255,0.9);
    font-size: 13px; color: #555; border-radius: 4px;
  }
  .preview-loading.hidden { display: none; }
  .preview-error {
    padding: 16px; font-size: 12px; color: #b91c1c; text-align: center;
  }
  .empty {
    color: #888; font-size: 12px; padding: 6px 0; text-align: center; font-style: italic;
  }
  .status {
    font-size: 11px; padding: 2px 6px; border-radius: 4px;
    display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
  }
  .status.idle { color: #16a34a; }
  .status.busy { color: #d97706; }
  .status.error { color: #b91c1c; }

  .legend {
    position: fixed; bottom: 24px; right: 12px; z-index: 1200;
    background: rgba(255,255,255,0.97); padding: 10px 12px; border-radius: 8px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15); font-size: 10px;
  }
  .legend .title { font-weight: 600; font-size: 12px; margin-bottom: 4px; }
  .legend .bar { width: 280px; height: 12px; border-radius: 2px; margin: 4px 0; }
  .legend .ticks {
    display: flex; justify-content: space-between;
    font-variant-numeric: tabular-nums; color: #555;
  }
  .legend .ticks span { flex: 0 0 auto; }
  .legend.hidden { display: none; }

  .leaflet-popup-content { font-size: 12px; line-height: 1.5; }
  .leaflet-popup-content .time { font-weight: 600; color: #111; }
</style>
</head>
<body>
<div id="map"></div>

<div class="panel">
  <div class="section">
    <div class="header">
      <h2>Bike rides</h2>
      <span id="status" class="status busy">Connecting…</span>
    </div>
    <span class="lbl">Your name</span>
    <input type="text" id="name-input" placeholder="e.g. Golam" maxlength="40">
    <label class="upload" id="upload-label">
      <input type="file" id="file-input" accept=".txt,text/plain" multiple>
      + Upload .txt file(s)
    </label>
  </div>

  <div class="section" id="ride-section">
    <span class="lbl">Select a ride</span>
    <div id="ride-empty" class="empty">No rides yet — upload a file above.</div>
    <select id="ride-select" style="display:none;"></select>
    <button class="btn danger" id="delete-btn" style="display:none;">Delete this ride</button>
  </div>

  <div class="section" id="stats-section" style="display:none;">
    <div class="stat"><span>Date</span><b id="s-date"></b></div>
    <div class="stat"><span>Rider</span><b id="s-user"></b></div>
    <div class="stat"><span>Duration</span><b id="s-dur"></b></div>
    <div class="stat"><span>Distance</span><b id="s-dist"></b></div>
    <div class="stat"><span>Avg temp</span><b id="s-temp"></b></div>
    <div class="stat"><span>Avg humidity</span><b id="s-hum"></b></div>
  </div>

  <div class="section" id="toggle-section" style="display:none;">
    <span class="lbl">Color by</span>
    <div class="toggle">
      <button id="b-temp" class="active">Temperature</button>
      <button id="b-hum">Humidity</button>
    </div>
  </div>

  <div class="section" id="zoom-section" style="display:none;">
    <span class="lbl">View width</span>
    <div class="toggle">
      <button id="z-free" class="active">Free</button>
      <button id="z-2k">2 km</button>
      <button id="z-5k">5 km</button>
      <button id="z-10k">10 km</button>
    </div>
  </div>

  <div class="section" id="plot-section" style="display:none;">
    <span class="lbl">Generate plots</span>
    <button class="btn plot" id="btn-spatial">Generate Spatial Plots</button>
    <button class="btn plot" id="btn-timeseries">Generate Time Series</button>
  </div>
</div>

<div class="preview" id="preview" style="display:none;">
  <div class="preview-header">
    <span id="preview-title">Preview</span>
    <div class="preview-actions">
      <button class="preview-btn download" id="preview-download" title="Download JPG">⬇</button>
      <button class="preview-btn" id="preview-close" title="Close">×</button>
    </div>
  </div>
  <div class="preview-body">
    <canvas id="preview-canvas"></canvas>
    <div class="preview-loading hidden" id="preview-loading">Generating…</div>
  </div>

<div class="legend hidden" id="legend">
  <div class="title" id="legend-title">Temperature</div>
  <div class="bar" id="legend-bar"></div>
  <div class="ticks" id="legend-ticks"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

// ---------- Firebase config ----------
const firebaseConfig = {
  apiKey: "AIzaSyBgph4khr-Vu77XmAZo5Jva_lFLEibm3PI",
  authDomain: "yale-bike-health.firebaseapp.com",
  projectId: "yale-bike-health",
  storageBucket: "yale-bike-health.firebasestorage.app",
  messagingSenderId: "1063907596080",
  appId: "1:1063907596080:web:6e634330075735748a9af5"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const RIDES = collection(db, 'rides');

const MAX_POINTS_PER_RIDE = 2000; // Firestore doc cap is 1MB; this is well under

// ---------- compression (keeps transfers small) ----------
function timeToSec(t) {
  const [h, m, s] = t.split(':').map(Number);
  return h * 3600 + m * 60 + s;
}
function secToTime(total) {
  total = ((total % 86400) + 86400) % 86400;
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function subsamplePoints(pts, maxCount) {
  if (pts.length <= maxCount) return pts.slice();
  const stride = Math.ceil(pts.length / maxCount);
  const out = [];
  for (let i = 0; i < pts.length; i += stride) out.push(pts[i]);
  if (out[out.length - 1] !== pts[pts.length - 1]) out.push(pts[pts.length - 1]);
  return out;
}
function packRide(ride) {
  const pts = subsamplePoints(ride.points, MAX_POINTS_PER_RIDE);
  const t0 = pts[0]?.t || '00:00:00';
  const t0Sec = timeToSec(t0);
  const dt = [], lat = [], lon = [], temp = [], hum = [];
  for (const pt of pts) {
    dt.push(timeToSec(pt.t) - t0Sec);
    lat.push(+pt.lat.toFixed(5));
    lon.push(+pt.lon.toFixed(5));
    temp.push(+pt.temp.toFixed(2));
    hum.push(+pt.hum.toFixed(2));
  }
  return {
    id: ride.id,
    u: ride.user || 'Anonymous',
    f: ride.filename || '',
    d: ride.dateIso || null,
    n: ride.dateDisplay || '',
    ts: ride.uploadedAt || Date.now(),
    t0,
    dt, lat, lon, temp, hum
  };
}
function unpackRide(c) {
  // Backwards-compat with very old object-form
  if (c.points && Array.isArray(c.points)) {
    return {
      id: c.id, user: c.user || 'Anonymous', filename: c.filename || '',
      dateIso: c.dateIso || null, dateDisplay: c.dateDisplay || '',
      uploadedAt: c.uploadedAt || 0, points: c.points
    };
  }
  // New format: parallel arrays
  if (c.dt && c.lat && c.lon && c.temp && c.hum) {
    const t0Sec = timeToSec(c.t0 || '00:00:00');
    const points = [];
    for (let i = 0; i < c.dt.length; i++) {
      points.push({
        t: secToTime(t0Sec + c.dt[i]),
        lat: c.lat[i],
        lon: c.lon[i],
        temp: c.temp[i],
        hum: c.hum[i]
      });
    }
    return {
      id: c.id, user: c.u || 'Anonymous', filename: c.f || '',
      dateIso: c.d || null, dateDisplay: c.n || '',
      uploadedAt: c.ts || 0, points
    };
  }
  // Old packed format with nested array (shouldn't exist in Firestore but kept for safety)
  if (c.p) {
    const t0Sec = timeToSec(c.t0 || '00:00:00');
    const points = (c.p || []).map(([dt, lat, lon, temp, hum]) => ({
      t: secToTime(t0Sec + dt), lat, lon, temp, hum
    }));
    return {
      id: c.id, user: c.u || 'Anonymous', filename: c.f || '',
      dateIso: c.d || null, dateDisplay: c.n || '',
      uploadedAt: c.ts || 0, points
    };
  }
  return null;
}

// ---------- local UI state ----------
const UI_KEY = 'bikeRidesUI_v2';
function loadUI() {
  try {
    const raw = localStorage.getItem(UI_KEY);
    if (!raw) return { selectedId: null, metric: 'temp', user: '', zoomMode: 'free' };
    const s = JSON.parse(raw);
    return {
      selectedId: s.selectedId || null,
      metric: s.metric || 'temp',
      user: s.user || '',
      zoomMode: s.zoomMode || 'free'
    };
  } catch (e) { return { selectedId: null, metric: 'temp', user: '', zoomMode: 'free' }; }
}
function saveUI(s) {
  try { localStorage.setItem(UI_KEY, JSON.stringify(s)); } catch (e) { console.error(e); }
}

// ---------- parsing ----------
function parseFile(text) {
  const points = [];
  for (const rawLine of text.split(/\r?\n/)) {
    const line = rawLine.trim();
    if (!line) continue;
    const parts = line.split(',').map(s => s.trim());
    if (parts.length !== 6) continue;
    const [t, lonS, latS, , tmpS, humS] = parts;
    if (!/^[EW]/.test(lonS) || !/^[NS]/.test(latS)) continue;
    const lon = parseFloat(lonS.slice(1)) * (lonS[0] === 'E' ? 1 : -1);
    const lat = parseFloat(latS.slice(1)) * (latS[0] === 'N' ? 1 : -1);
    const temp = parseFloat(String(tmpS).replace(/C$/i, ''));
    const hum = parseFloat(String(humS).replace(/%$/, ''));
    if (![lat, lon, temp, hum].every(Number.isFinite)) continue;
    points.push({ t, lat, lon, temp, hum });
  }

  // Smart-T sensors sometimes record temperature in Fahrenheit while labeling it "C".
  // Rule of thumb: ambient temperatures >= 50 are Fahrenheit (any realistic ambient
  // reading in °C is well under 50). If the median temperature is in F range, convert.
  if (points.length > 0) {
    const sorted = points.map(p => p.temp).sort((a, b) => a - b);
    const median = sorted[Math.floor(sorted.length / 2)];
    if (median >= 50) {
      for (const p of points) p.temp = (p.temp - 32) * 5 / 9;
      console.log(`[unit-fix] Detected Fahrenheit (median=${median.toFixed(1)}); converted to °C.`);
    }
  }

  return points;
}
function dateFromFilename(filename) {
  const base = filename.replace(/\.txt$/i, '');
  const m = base.match(/^(\d{4})(\d{2})(\d{2})/);
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  return null;
}
function prettyDate(iso) {
  const [y, mo, d] = iso.split('-').map(Number);
  const dt = new Date(Date.UTC(y, mo-1, d));
  return dt.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
}

// ---------- map setup ----------
const map = L.map('map', { worldCopyJump: true }).setView([1.31, 103.78], 14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap contributors', maxZoom: 19
}).addTo(map);
L.control.scale({ imperial: false, maxWidth: 150, position: 'bottomleft' }).addTo(map);
let layerGroup = L.layerGroup().addTo(map);

function colorFor(v, vmin, vmax) {
  const t = vmax === vmin ? 0.5 : Math.max(0, Math.min(1, (v - vmin) / (vmax - vmin)));
  const hue = 220 - t * 220;
  return `hsl(${hue}, 80%, 50%)`;
}
function haversine(a, b) {
  const R = 6371000, toR = Math.PI/180;
  const dLat = (b.lat - a.lat) * toR;
  const dLon = (b.lon - a.lon) * toR;
  const la1 = a.lat * toR, la2 = b.lat * toR;
  const x = Math.sin(dLat/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
function rideDistance(pts) {
  let d = 0;
  for (let i = 1; i < pts.length; i++) d += haversine(pts[i-1], pts[i]);
  return d;
}
const ZOOM_FOR_KM = { '2k': 15, '5k': 14, '10k': 13 };
function applyZoom(ride) {
  if (!ride || ride.points.length < 2) return;
  const bounds = L.latLngBounds(ride.points.map(p => [p.lat, p.lon]));
  if (ui.zoomMode === 'free') map.fitBounds(bounds, { padding: [40, 40] });
  else map.setView(bounds.getCenter(), ZOOM_FOR_KM[ui.zoomMode]);
}

function renderRide(ride, metric) {
  layerGroup.clearLayers();
  if (!ride || ride.points.length < 2) {
    document.getElementById('legend').classList.add('hidden');
    return;
  }
  const pts = ride.points;
  const vals = metric === 'temp' ? pts.map(p => p.temp) : pts.map(p => p.hum);
  const vmin = Math.min(...vals), vmax = Math.max(...vals);

  for (let i = 1; i < pts.length; i++) {
    const v = (vals[i-1] + vals[i]) / 2;
    const seg = L.polyline(
      [[pts[i-1].lat, pts[i-1].lon], [pts[i].lat, pts[i].lon]],
      { color: colorFor(v, vmin, vmax), weight: 5, opacity: 0.9 }
    );
    const p = pts[i];
    seg.bindPopup(
      `<div class="time">${p.t}</div>` +
      `Temp: ${p.temp.toFixed(2)}°<br>` +
      `Humidity: ${p.hum.toFixed(2)}%<br>` +
      `<span style="color:#888">${p.lat.toFixed(5)}, ${p.lon.toFixed(5)}</span>`
    );
    layerGroup.addLayer(seg);
  }
  const start = pts[0], end = pts[pts.length-1];
  layerGroup.addLayer(L.circleMarker([start.lat, start.lon], {
    radius: 8, color: '#fff', weight: 2, fillColor: '#16a34a', fillOpacity: 1
  }).bindPopup(`<b>Start</b><br>${start.t}`));
  layerGroup.addLayer(L.circleMarker([end.lat, end.lon], {
    radius: 8, color: '#fff', weight: 2, fillColor: '#dc2626', fillOpacity: 1
  }).bindPopup(`<b>End</b><br>${end.t}`));
  applyZoom(ride);

  const unit = metric === 'temp' ? '°' : '%';
  document.getElementById('legend-title').textContent = metric === 'temp' ? 'Temperature' : 'Humidity';
  const N_TICKS = 8;
  const ticksEl = document.getElementById('legend-ticks');
  ticksEl.innerHTML = '';
  for (let i = 0; i < N_TICKS; i++) {
    const v = vmin + (vmax - vmin) * (i / (N_TICKS - 1));
    const span = document.createElement('span');
    span.textContent = v.toFixed(1) + unit;
    ticksEl.appendChild(span);
  }
  const stops = [];
  for (let i = 0; i <= 10; i++) {
    const v = vmin + (vmax - vmin) * (i/10);
    stops.push(colorFor(v, vmin, vmax) + ' ' + (i*10) + '%');
  }
  document.getElementById('legend-bar').style.background =
    'linear-gradient(to right, ' + stops.join(', ') + ')';
  document.getElementById('legend').classList.remove('hidden');
}

function renderStats(ride) {
  const sec = document.getElementById('stats-section');
  if (!ride) { sec.style.display = 'none'; return; }
  sec.style.display = '';
  const pts = ride.points;
  const avg = arr => arr.reduce((a,b)=>a+b,0)/arr.length;
  document.getElementById('s-date').textContent = ride.dateDisplay || '—';
  document.getElementById('s-user').textContent = ride.user || 'Anonymous';
  document.getElementById('s-dur').textContent =
    pts.length > 1 ? `${pts[0].t} → ${pts[pts.length-1].t}` : '—';
  document.getElementById('s-dist').textContent = (rideDistance(pts)/1000).toFixed(2) + ' km';
  document.getElementById('s-temp').textContent = avg(pts.map(p=>p.temp)).toFixed(1) + '°';
  document.getElementById('s-hum').textContent = avg(pts.map(p=>p.hum)).toFixed(1) + '%';
}

function rideLabel(r) {
  const pts = r.points;
  const first = pts[0]?.t || '';
  const last = pts[pts.length-1]?.t || '';
  const distKm = (rideDistance(pts)/1000).toFixed(2);
  const user = r.user || 'Anonymous';
  const date = r.dateDisplay || 'Unknown date';
  return `${date} · ${first}–${last} · ${distKm} km · ${user}`;
}
function rideSortKey(r) {
  const datePart = r.dateIso || '9999-12-31';
  const timePart = r.points[0]?.t || '00:00:00';
  return `${datePart}T${timePart}`;
}

// ---------- state ----------
let rides = [];
let ui = loadUI();
let pendingSelectId = null;   // set during upload, picks up new ride when snapshot arrives
let firstSnapshot = true;

const fileInput = document.getElementById('file-input');
const uploadLabel = document.getElementById('upload-label');
const nameInput = document.getElementById('name-input');
const rideSelect = document.getElementById('ride-select');
const rideEmpty = document.getElementById('ride-empty');
const deleteBtn = document.getElementById('delete-btn');
const toggleSec = document.getElementById('toggle-section');
const zoomSec = document.getElementById('zoom-section');
const plotSec = document.getElementById('plot-section');
const btnSpatial = document.getElementById('btn-spatial');
const btnTimeseries = document.getElementById('btn-timeseries');
const previewEl = document.getElementById('preview');
const previewCanvas = document.getElementById('preview-canvas');
const previewLoading = document.getElementById('preview-loading');
const previewTitle = document.getElementById('preview-title');
const previewDownload = document.getElementById('preview-download');
const previewClose = document.getElementById('preview-close');
const bTemp = document.getElementById('b-temp');
const bHum = document.getElementById('b-hum');
const zFree = document.getElementById('z-free');
const z2k = document.getElementById('z-2k');
const z5k = document.getElementById('z-5k');
const z10k = document.getElementById('z-10k');
const statusEl = document.getElementById('status');

nameInput.value = ui.user;

function setStatus(kind, text) {
  statusEl.className = `status ${kind}`;
  statusEl.textContent = text;
}

function renderAll() {
  const hasRides = rides.length > 0;
  rideSelect.style.display = hasRides ? '' : 'none';
  deleteBtn.style.display = hasRides ? '' : 'none';
  toggleSec.style.display = hasRides ? '' : 'none';
  zoomSec.style.display = hasRides ? '' : 'none';
  plotSec.style.display = hasRides ? '' : 'none';
  rideEmpty.style.display = hasRides ? 'none' : '';

  rideSelect.innerHTML = '';
  const sorted = [...rides].sort((a,b) => rideSortKey(a).localeCompare(rideSortKey(b)));
  for (const r of sorted) {
    const opt = document.createElement('option');
    opt.value = r.id;
    opt.textContent = rideLabel(r);
    rideSelect.appendChild(opt);
  }
  if (hasRides && !rides.find(r => r.id === ui.selectedId)) {
    ui.selectedId = sorted[sorted.length - 1].id;
    saveUI(ui);
  }
  rideSelect.value = ui.selectedId || '';

  bTemp.classList.toggle('active', ui.metric === 'temp');
  bHum.classList.toggle('active', ui.metric === 'hum');
  zFree.classList.toggle('active', ui.zoomMode === 'free');
  z2k.classList.toggle('active', ui.zoomMode === '2k');
  z5k.classList.toggle('active', ui.zoomMode === '5k');
  z10k.classList.toggle('active', ui.zoomMode === '10k');

  const ride = rides.find(r => r.id === ui.selectedId) || null;
  renderStats(ride);
  renderRide(ride, ui.metric);
}

// ---------- Firestore subscription ----------
onSnapshot(RIDES, (snap) => {
  const next = [];
  snap.forEach(d => next.push(unpackRide(d.data())));
  rides = next;
  // If we have a pending newly-uploaded ride, select it once it appears
  if (pendingSelectId && rides.find(r => r.id === pendingSelectId)) {
    ui.selectedId = pendingSelectId;
    saveUI(ui);
    pendingSelectId = null;
  }
  renderAll();
  if (firstSnapshot) {
    setStatus('idle', `✓ ${rides.length} ride${rides.length===1?'':'s'}`);
    firstSnapshot = false;
  }
}, (err) => {
  console.error('Snapshot error:', err);
  setStatus('error', 'Connection failed');
  rideEmpty.textContent = 'Could not connect to Firestore. Check your security rules.';
});

async function uploadRide(rideObj) {
  const packed = packRide(rideObj);
  await setDoc(doc(RIDES, rideObj.id), packed);
}

async function deleteRide(id) {
  await deleteDoc(doc(RIDES, id));
}

  const files = Array.from(e.target.files);

  if (!currentUser) {

      return;

  }

  let added = 0, skipped = 0, failed = 0, lastId = null;

      const dateIso = dateFromFilename(f.name);
      const dateDisplay = dateIso ? prettyDate(dateIso) : f.name.replace(/\.txt$/i, '');
      const id = 'r_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);

        dateIso,

        uploadedAt: Date.now(),

      };
      await uploadRide(ride);
      // Optimistic local update so the legend & route appear immediately

      if (!rides.find(r => r.id === ride.id)) rides.push(ride);
      ui.selectedId = id;
      lastId = id;
      added++;

    }

  if (lastId) {

    renderAll();

  if (failed > 0) {
    setStatus('error', 'Some saves failed');
    alert(`${added} saved, ${failed} failed.\n\nCheck the browser console for details. If you see permission errors, check that your Firestore rules allow read/write.`);
  } else {
    setStatus('idle', `✓ Saved`);

// ---------- Plot generation ----------
const PLOT_BOUNDS = {
  south: 1.303634, north: 1.324667,
  west: 103.764777, east: 103.790359
};
const PLOT_ZOOM = 16;
const SAT_TILE_URL = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
const tileCache = new Map();
let bgPromise = null;       // cached satellite background
let isGenerating = false;

function project(lon, lat, zoom) {
  const TS = 256;
  const scale = TS * Math.pow(2, zoom);
  const x = (lon + 180) / 360 * scale;
  const sinLat = Math.max(-0.9999, Math.min(0.9999, Math.sin(lat * Math.PI / 180)));
  const y = (0.5 - Math.log((1 + sinLat) / (1 - sinLat)) / (4 * Math.PI)) * scale;
  return { x, y };
}

function loadImage(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('Tile failed: ' + url));
    img.src = url;
  });
}

async function fetchTile(z, y, x) {
  const key = `${z}/${y}/${x}`;
  if (tileCache.has(key)) return tileCache.get(key);
  const url = SAT_TILE_URL.replace('{z}', z).replace('{y}', y).replace('{x}', x);
  const img = await loadImage(url);
  tileCache.set(key, img);
  return img;
}

async function buildSatelliteBackground() {
  if (bgPromise) return bgPromise;
  bgPromise = (async () => {
    const sw = project(PLOT_BOUNDS.west, PLOT_BOUNDS.south, PLOT_ZOOM);
    const ne = project(PLOT_BOUNDS.east, PLOT_BOUNDS.north, PLOT_ZOOM);
    const minX = Math.min(sw.x, ne.x), maxX = Math.max(sw.x, ne.x);
    const minY = Math.min(sw.y, ne.y), maxY = Math.max(sw.y, ne.y);
    const minTileX = Math.floor(minX / 256), maxTileX = Math.floor(maxX / 256);
    const minTileY = Math.floor(minY / 256), maxTileY = Math.floor(maxY / 256);

    const tasks = [];
    for (let ty = minTileY; ty <= maxTileY; ty++) {
      for (let tx = minTileX; tx <= maxTileX; tx++) {
        tasks.push(fetchTile(PLOT_ZOOM, ty, tx).then(img => ({ img, tx, ty })));
      }
    }
    const tiles = await Promise.all(tasks);

    const fullW = (maxTileX - minTileX + 1) * 256;
    const fullH = (maxTileY - minTileY + 1) * 256;
    const canvas = document.createElement('canvas');
    canvas.width = fullW; canvas.height = fullH;
    const ctx = canvas.getContext('2d');
    for (const { img, tx, ty } of tiles) {
      ctx.drawImage(img, (tx - minTileX) * 256, (ty - minTileY) * 256);
    }

    return {
      canvas,
      cropX: minX - minTileX * 256,
      cropY: minY - minTileY * 256,
      cropW: maxX - minX,
      cropH: maxY - minY,
      offsetX: minTileX * 256,
      offsetY: minTileY * 256,
      zoom: PLOT_ZOOM
    };
  })().catch(err => { bgPromise = null; throw err; });
  return bgPromise;
}

// MATLAB-style jet colormap
function jetColor(t) {
  t = Math.max(0, Math.min(1, t));
  let r, g, b;
  if (t < 0.125)      { r = 0;                 g = 0;                 b = 0.5 + t * 4; }
  else if (t < 0.375) { r = 0;                 g = (t - 0.125) * 4;   b = 1; }
  else if (t < 0.625) { r = (t - 0.375) * 4;   g = 1;                 b = 1 - (t - 0.375) * 4; }
  else if (t < 0.875) { r = 1;                 g = 1 - (t - 0.625) * 4; b = 0; }
  else                { r = 1 - (t - 0.875) * 4; g = 0;               b = 0; }
  return `rgb(${Math.round(r*255)},${Math.round(g*255)},${Math.round(b*255)})`;
}

// Meteorology — Magnus formula (Ea in hPa), Stull 2011 formula (Tw in °C)
function vaporPressure(T, RH) {
  const es = 6.112 * Math.exp(17.62 * T / (243.12 + T));
  return es * RH / 100;
}
function wetBulb(T, RH) {
  const Tc = Math.max(-20, Math.min(50, T));
  const RHc = Math.max(5, Math.min(99, RH));
  return Tc * Math.atan(0.151977 * Math.sqrt(RHc + 8.313659))
       + Math.atan(Tc + RHc)
       - Math.atan(RHc - 1.676331)
       + 0.00391838 * Math.pow(RHc, 1.5) * Math.atan(0.023101 * RHc)
       - 4.686035;
}

// Render one spatial panel inside the supplied region
function renderSpatialPanel(ctx, panel, bg, pts, values, title, unit) {
  const titleH = 36, tickPadL = 70, tickPadB = 36, cbarGap = 16, cbarW = 22, cbarLabelW = 56;
  const availX = panel.x + tickPadL;
  const availY = panel.y + titleH;
  const availW = panel.w - tickPadL - cbarGap - cbarW - cbarLabelW - 8;
  const availH = panel.h - titleH - tickPadB;

  // Preserve geographic aspect ratio — fit map inside available area, center it
  const dataAspect = bg.cropW / bg.cropH;
  let mapW, mapH;
  if (availW / availH > dataAspect) {
    mapH = availH;
    mapW = mapH * dataAspect;
  } else {
    mapW = availW;
    mapH = mapW / dataAspect;
  }
  const mapX = availX + (availW - mapW) / 2;
  const mapY = availY + (availH - mapH) / 2;

  // Satellite background, cropped to bounds
  ctx.save();
  ctx.beginPath();
  ctx.rect(mapX, mapY, mapW, mapH);
  ctx.clip();
  ctx.drawImage(
    bg.canvas,
    bg.cropX, bg.cropY, bg.cropW, bg.cropH,
    mapX, mapY, mapW, mapH
  );
  ctx.restore();

  // Project lon/lat → panel pixel
  function projPt(lon, lat) {
    const p = project(lon, lat, bg.zoom);
    return {
      x: mapX + ((p.x - bg.offsetX) - bg.cropX) * mapW / bg.cropW,
      y: mapY + ((p.y - bg.offsetY) - bg.cropY) * mapH / bg.cropH
    };
  }

  const vmin = Math.min(...values), vmax = Math.max(...values);

  // Colored route (clipped to map area)
  ctx.save();
  ctx.beginPath();
  ctx.rect(mapX, mapY, mapW, mapH);
  ctx.clip();
  ctx.lineWidth = 3.5;
  ctx.lineCap = 'round';
  for (let i = 1; i < pts.length; i++) {
    const a = projPt(pts[i-1].lon, pts[i-1].lat);
    const b = projPt(pts[i].lon, pts[i].lat);
    const v = (values[i-1] + values[i]) / 2;
    const t = vmax === vmin ? 0.5 : (v - vmin) / (vmax - vmin);
    ctx.strokeStyle = jetColor(t);
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  }
  ctx.restore();

  // Map border
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1;
  ctx.strokeRect(mapX + 0.5, mapY + 0.5, mapW, mapH);

  // Title (centered just above the map)
  ctx.fillStyle = '#000';
  ctx.font = 'bold 18px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(title, mapX + mapW / 2, mapY - 12);

  // Unit (just above the colorbar)
  ctx.font = 'italic 14px serif';
  ctx.textAlign = 'left';
  ctx.fillText(unit, mapX + mapW + cbarGap, mapY - 12);

  // Colorbar
  const cbX = mapX + mapW + cbarGap;
  const cbY = mapY;
  const grad = ctx.createLinearGradient(0, cbY + mapH, 0, cbY);
  for (let i = 0; i <= 10; i++) grad.addColorStop(i / 10, jetColor(i / 10));
  ctx.fillStyle = grad;
  ctx.fillRect(cbX, cbY, cbarW, mapH);
  ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
  ctx.strokeRect(cbX + 0.5, cbY + 0.5, cbarW, mapH);

  // Colorbar ticks
  ctx.fillStyle = '#000';
  ctx.font = '12px sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  const N_CB = 8;
  for (let i = 0; i < N_CB; i++) {
    const t = i / (N_CB - 1);
    const v = vmin + (vmax - vmin) * t;
    const y = cbY + mapH - mapH * t;
    ctx.fillText(v.toFixed(2), cbX + cbarW + 4, y);
    ctx.beginPath();
    ctx.moveTo(cbX + cbarW, y);
    ctx.lineTo(cbX + cbarW + 3, y);
    ctx.stroke();
  }

  // Lat ticks (left of map)
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  ctx.font = '11px sans-serif';
  const N_LAT = 4;
  for (let i = 0; i < N_LAT; i++) {
    const t = i / (N_LAT - 1);
    const lat = PLOT_BOUNDS.south + (PLOT_BOUNDS.north - PLOT_BOUNDS.south) * t;
    const y = mapY + mapH - mapH * t;
    ctx.fillText(lat.toFixed(3) + '°N', mapX - 5, y);
    ctx.beginPath();
    ctx.moveTo(mapX - 3, y); ctx.lineTo(mapX, y); ctx.stroke();
  }

  // Lon ticks (below map)
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  const N_LON = 4;
  for (let i = 0; i < N_LON; i++) {
    const t = i / (N_LON - 1);
    const lon = PLOT_BOUNDS.west + (PLOT_BOUNDS.east - PLOT_BOUNDS.west) * t;
    const x = mapX + mapW * t;
    ctx.fillText(lon.toFixed(3) + '°E', x, mapY + mapH + 5);
    ctx.beginPath();
    ctx.moveTo(x, mapY + mapH); ctx.lineTo(x, mapY + mapH + 3); ctx.stroke();
  }
}

async function buildSpatialCanvas(ride) {
  const pts = ride.points;
  const tempVals = pts.map(p => p.temp);
  const eaVals = pts.map(p => vaporPressure(p.temp, p.hum));
  const twVals = pts.map(p => wetBulb(p.temp, p.hum));

  const bg = await buildSatelliteBackground();

  const TOTAL_W = 1400, TOTAL_H = 890;
  const PW = TOTAL_W / 3;
  const PH = TOTAL_H;
  const canvas = document.createElement('canvas');
  canvas.width = TOTAL_W;
  canvas.height = TOTAL_H;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'white';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  renderSpatialPanel(ctx, { x: 0,      y: 0, w: PW, h: PH }, bg, pts, tempVals, 'Temperature',         '°C');
  renderSpatialPanel(ctx, { x: PW,     y: 0, w: PW, h: PH }, bg, pts, eaVals,   'Vapor Pressure (Ea)', 'hPa');
  renderSpatialPanel(ctx, { x: PW * 2, y: 0, w: PW, h: PH }, bg, pts, twVals,   'Wet-Bulb (Tw)',       '°C');

  return canvas;
}

// Time series
function renderTimeSeriesPanel(ctx, panel, times, values, ylabel) {
  const padL = 80, padR = 30, padT = 16, padB = 38;
  const plotX = panel.x + padL;
  const plotY = panel.y + padT;
  const plotW = panel.w - padL - padR;
  const plotH = panel.h - padT - padB;

  const tmin = times[0], tmax = times[times.length - 1];
  const vmin = Math.min(...values), vmax = Math.max(...values);
  const vpad = (vmax - vmin) * 0.08 || 1;
  const yMin = vmin - vpad, yMax = vmax + vpad;

  const projX = t => plotX + (t - tmin) / (tmax - tmin || 1) * plotW;
  const projY = v => plotY + plotH - (v - yMin) / (yMax - yMin) * plotH;

  // Plot background
  ctx.fillStyle = 'white';
  ctx.fillRect(plotX, plotY, plotW, plotH);

  // Grid
  ctx.strokeStyle = '#e8e8e8';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 1; i < 6; i++) {
    const x = plotX + plotW * i / 6;
    ctx.moveTo(x, plotY); ctx.lineTo(x, plotY + plotH);
  }
  for (let i = 1; i < 5; i++) {
    const y = plotY + plotH * i / 5;
    ctx.moveTo(plotX, y); ctx.lineTo(plotX + plotW, y);
  }
  ctx.stroke();

  // Orange data dots
  ctx.fillStyle = '#d95319';   // MATLAB default orange-red
  for (let i = 0; i < times.length; i++) {
    const x = projX(times[i]);
    const y = projY(values[i]);
    ctx.beginPath();
    ctx.arc(x, y, 1.6, 0, Math.PI * 2);
    ctx.fill();
  }

  // Axes
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(plotX, plotY);
  ctx.lineTo(plotX, plotY + plotH);
  ctx.lineTo(plotX + plotW, plotY + plotH);
  ctx.stroke();

  // X ticks (time)
  ctx.fillStyle = '#000';
  ctx.font = '13px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  const N_X = 6;
  for (let i = 0; i <= N_X; i++) {
    const t = tmin + (tmax - tmin) * i / N_X;
    const x = projX(t);
    const lbl = secToTime(Math.round(t)).slice(0, 5);
    ctx.fillText(lbl, x, plotY + plotH + 6);
    ctx.beginPath();
    ctx.moveTo(x, plotY + plotH); ctx.lineTo(x, plotY + plotH + 4); ctx.stroke();
  }

  // Y ticks
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  const N_Y = 5;
  for (let i = 0; i <= N_Y; i++) {
    const v = yMin + (yMax - yMin) * i / N_Y;
    const y = projY(v);
    ctx.fillText(v.toFixed(1), plotX - 6, y);
    ctx.beginPath();
    ctx.moveTo(plotX - 4, y); ctx.lineTo(plotX, y); ctx.stroke();
  }

  // Y-axis label (rotated)
  ctx.save();
  ctx.translate(panel.x + 22, plotY + plotH / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '15px sans-serif';
  ctx.fillText(ylabel, 0, 0);
  ctx.restore();
}

function buildTimeSeriesCanvas(ride) {
  const pts = ride.points;
  const t0Sec = timeToSec(pts[0].t);
  // Use seconds-from-start internally; format back to clock time for labels
  const startSec = t0Sec;
  const times = pts.map(p => timeToSec(p.t));
  const tempVals = pts.map(p => p.temp);
  const eaVals = pts.map(p => vaporPressure(p.temp, p.hum));
  const twVals = pts.map(p => wetBulb(p.temp, p.hum));

  const PW = 1400, PH = 280, footerH = 50;
  const canvas = document.createElement('canvas');
  canvas.width = PW;
  canvas.height = PH * 3 + footerH;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'white';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  renderTimeSeriesPanel(ctx, { x: 0, y: 0,        w: PW, h: PH }, times, tempVals, 'Ta (°C)');
  renderTimeSeriesPanel(ctx, { x: 0, y: PH,       w: PW, h: PH }, times, eaVals,   'Ea (hPa)');
  renderTimeSeriesPanel(ctx, { x: 0, y: PH * 2,   w: PW, h: PH }, times, twVals,   'Tw (°C)');

  // Date footer (bottom-right)
  if (ride.dateDisplay) {
    ctx.fillStyle = '#222';
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillText(ride.dateDisplay, PW - 30, PH * 3 + footerH / 2);
  }

  return canvas;
}

// Filename helpers
function safeFilenamePart(s) {
  return String(s || '').replace(/[^a-zA-Z0-9_-]/g, '_').replace(/_+/g, '_');
}
function buildFilename(ride, suffix) {
  const dateP = ride.dateIso || 'date';
  const t0 = (ride.points[0]?.t || '').replace(/:/g, '');
  const t1 = (ride.points[ride.points.length-1]?.t || '').replace(/:/g, '');
  const distKm = (rideDistance(ride.points)/1000).toFixed(2);
  const user = safeFilenamePart(ride.user || 'anon');
  return `${dateP}_${t0}-${t1}_${distKm}km_${user}_${suffix}.jpg`;
}

// Preview pipeline
let currentPreviewCanvas = null;
let currentPreviewFilename = null;

function showPreviewBox() { previewEl.style.display = ''; }
function hidePreviewBox() { previewEl.style.display = 'none'; }

async function runGenerate(kind) {
  if (isGenerating) return;
  const ride = rides.find(r => r.id === ui.selectedId);
  if (!ride) { alert('Select a ride first.'); return; }

  isGenerating = true;
  btnSpatial.disabled = true;
  btnTimeseries.disabled = true;
  showPreviewBox();
  previewLoading.classList.remove('hidden');
  previewLoading.textContent = kind === 'spatial' ? 'Generating spatial plots…' : 'Generating time series…';
  previewTitle.textContent = kind === 'spatial' ? 'Spatial Plots' : 'Time Series';

  try {
    const canvas = kind === 'spatial'
      ? await buildSpatialCanvas(ride)
      : buildTimeSeriesCanvas(ride);

    // Render to visible preview canvas (scaled)
    const previewMaxW = 480;
    const scale = Math.min(1, previewMaxW / canvas.width);
    previewCanvas.width = Math.round(canvas.width * scale);
    previewCanvas.height = Math.round(canvas.height * scale);
    const pctx = previewCanvas.getContext('2d');
    pctx.drawImage(canvas, 0, 0, previewCanvas.width, previewCanvas.height);

    currentPreviewCanvas = canvas;
    currentPreviewFilename = buildFilename(ride, kind === 'spatial' ? 'spatial' : 'timeseries');
    previewLoading.classList.add('hidden');
  } catch (err) {
    console.error(err);
    previewLoading.textContent = 'Failed: ' + (err.message || 'unknown error');
    currentPreviewCanvas = null;
  } finally {
    isGenerating = false;
    btnSpatial.disabled = false;
    btnTimeseries.disabled = false;
  }
}

btnSpatial.addEventListener('click', () => runGenerate('spatial'));
btnTimeseries.addEventListener('click', () => runGenerate('timeseries'));
previewClose.addEventListener('click', () => { hidePreviewBox(); currentPreviewCanvas = null; });
previewDownload.addEventListener('click', () => {
  if (!currentPreviewCanvas) return;
  const link = document.createElement('a');
  link.download = currentPreviewFilename || 'plot.jpg';
  link.href = currentPreviewCanvas.toDataURL('image/jpeg', 0.92);
  link.click();
});

function setZoomMode(m) { ui.zoomMode = m; saveUI(ui); renderAll(); }
zFree.addEventListener('click', () => setZoomMode('free'));
z2k.addEventListener('click',   () => setZoomMode('2k'));
z5k.addEventListener('click',   () => setZoomMode('5k'));
z10k.addEventListener('click',  () => setZoomMode('10k'));

setTimeout(() => map.invalidateSize(), 100);
window.addEventListener('resize', () => map.invalidateSize());
</script>
</body>
